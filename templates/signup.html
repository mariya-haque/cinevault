<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign Up — CineVault</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <p class="brand">CineVault</p>
    <p class="subtitle">Create a new account.</p>

    <div class="field">
      <label for="signup_username">Username</label>
      <input type="text" id="signup_username" placeholder="e.g. mariya22">
    </div>

    <div class="field">
      <label for="signup_email">Email Address</label>
      <input type="email" id="signup_email" placeholder="e.g. mariya@example.com">
    </div>

    <div class="field">
      <label for="signup_password">Password</label>
      <input type="password" id="signup_password" placeholder="••••••••">
    </div>

    <button class="btn btn-primary" onclick="signup()">Sign Up</button>

    <p class="switch-link">Already have an account? <a href="/login">Log in</a></p>
  </div>
</div>

<script src="/static/script.js"></script>
</body>
</html>
