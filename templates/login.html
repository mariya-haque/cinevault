<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Log In — CineVault</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <p class="brand">CineVault</p>
    <p class="subtitle">Log in to your account.</p>

    <div class="field">
      <label for="login_username">Username</label>
      <input type="text" id="login_username" placeholder="e.g. mariya22">
    </div>

    <div class="field">
      <label for="login_password">Password</label>
      <input type="password" id="login_password" placeholder="••••••••">
    </div>

    <button class="btn btn-primary" onclick="login()">Log In</button>

    <p class="switch-link">New here? <a href="/">Sign up</a></p>
  </div>
</div>

<script src="/static/script.js"></script>
</body>
</html>
